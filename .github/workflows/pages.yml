# A ogni modifica: costruisce il gioco, lo verifica (partite simulate + screenshot) e,
# se la modifica è sul ramo principale, lo pubblica su GitHub Pages.
name: Verifica e pubblica

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # solo il browser, senza pacchetti di sistema: il server di GitHub ha già ciò che serve, e scaricare
      # quei pacchetti (caratteri aggiuntivi) falliva quando i loro archivi non erano raggiungibili
      - run: npx playwright install chromium
      - run: npm run contatto-portiere
      - run: npm run traiettorie
      - run: npm run portiere -- --salva=tests/screenshot/portiere-v071.json
      - run: npm run tiro-visuale
      - run: npm run tiro-registrato
      - run: npm run tiro-comando
      - run: npm run finta-fluida
      - run: npm run scatto-inizio
      - run: npm run rig-mani
      - run: npm run rimesse
      - run: npm run dimensioni-palla -- --salva=tests/screenshot/dimensioni-v072.json --foto=tests/screenshot/dimensioni-v072
      # sul server i caratteri dei testi sono diversi da quelli usati per gli screenshot di riferimento:
      # lì gli screenshot si guardano soltanto, mentre le partite simulate devono passare
      - run: npm run verifica -- --screenshot-non-bloccanti
      - run: npm run regia-tiro -- --no-build
      - run: npm run tornei-menu -- --no-build
      - run: npm run rigori-finali -- --no-build
      - run: npm run gameplay -- --no-build
      - run: npm run centroboa -- --no-build
      - run: npm run tattica -- --no-build
      - run: npm run espulsioni-tempi
      - run: npm run rigori-regole
      - run: npm run rigori-reali
      - run: npm run boa-fronte
      - run: npm run chiamate-attacco
      - run: npm run servizio-boa
      - run: npm run gesti-fluidi
      - run: npm run difesa-cambi
      - run: npm run entrate -- --no-build
      - run: npm run entrate-integrazione -- --no-build
      - run: npm run area-movimento -- --no-build
      - run: npm run strategie -- --no-build
      - run: npm run nuoto -- --no-build
      - run: npm run nuoto-coerente -- --no-build
      - run: npm run gioco-fermo -- --no-build
      - run: npm run posizioni
      - run: npm run orientamento -- --no-build
      - run: npm run finta -- --no-build
      - run: npm run desktop -- --no-build
      - run: npm run gesti -- --no-build
      - run: npm run costumi -- --no-build
      - run: npm run home -- --no-build
      - run: npm run replay -- --no-build
      - run: npm run replay-ui -- --no-build
      - run: npm run fisica-palla -- --no-build
      - run: npm run fisica-acqua
      - run: npm run sezione1 -- --no-build
      - run: npm run sezione2 -- --no-build
      - run: npm run sezione3 -- --no-build
      - run: npm run sezione4 -- --no-build
      - run: npm run sezione5 -- --no-build
      - run: npm run uomo -- --no-build
      - run: npm run inferiorita
      - run: npm run v046 -- --no-build
      - run: npm run sezione6 -- --no-build
      - run: npm run dati-tesi -- --no-build
      - run: npm run statistiche -- --no-build
      - run: npm run azione -- --no-build
      - run: npm run aspetto -- --no-build --solo-gioco
      - run: npm run cronaca -- --no-build --solo-controlli
      - run: npm run menu -- --no-build --solo-controlli
      - run: npm run comandi-interfaccia -- --no-build
      - run: npm run passaggi -- --no-build
      - run: npm run cambi-marcatura -- --no-build
      - run: npm run tiri-centro -- --no-build
      - run: npm run cambi-volanti -- --no-build
      - run: npm run timeout -- --no-build
      - run: npm run rigore -- --no-build
      - run: npm run finte -- --no-build
      - run: npm run finte-mano -- --no-build
      - run: npm run rose -- --no-build
      - run: npm run palombella -- --no-build
      - run: npm run ritocchi -- --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: tests/screenshot
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  pubblica:
    needs: verifica
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
